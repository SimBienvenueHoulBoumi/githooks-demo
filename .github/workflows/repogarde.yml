# Vérifications repogarde en CI (obligatoires pour merger : à déclarer en
# "required status check" dans les règles de protection de la branche).
name: repogarde

on:
  pull_request:
    # edited : revérifie quand le titre de la PR change (message du commit en squash)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Lancé par le workflow de release sur sa PR (release-auto)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repogarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : messages de commit, diff depuis la base

      # Outils du projet nécessaires au formatage et aux tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # ruff : formatage et code mort prouvé ; vulture : code mort ; pytest : tests
      - run: pip install ruff==0.16.10 vulture==2.16 pytest==9.1.1

      # Autres exemples :
      # - uses: actions/setup-java@v6
      #   with: { distribution: temurin, java-version: 21, cache: maven }
      # - uses: actions/setup-node@v7
      #   with: { node-version: 24, cache: npm }
      # - run: npm ci

      - uses: SimBienvenueHoulBoumi/repogarde@v3
        with:
          strict: true
